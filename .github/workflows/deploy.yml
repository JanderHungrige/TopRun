name: build-and-push

# Build the TopRun image and push it to GHCR on every push to main. The image build runs the
# unit tests and the type-check (see Dockerfile), so a red test never reaches the registry.
# The host (159.195.148.193) runs a root cron (deploy/roll-all.sh -> deploy/auto-deploy.sh)
# that polls GHCR and rolls the container — this workflow never SSHes into the host.
#
#   main -> image :main (+ :<sha>) -> prod stack on 172.17.0.1:8081 -> toprun.questenterprise.de
#
# TLS and the domain are handled in front by Nginx Proxy Manager.

on:
  # Manual trigger: rebuild without a code change (e.g. to pick up base-image fixes).
  workflow_dispatch:
  push:
    branches: [main]
    # Planning docs and deploy config do not change the image.
    paths-ignore:
      - '.mdd/**'
      - 'deploy/**'
      - '**.md'
  # A pull request builds and tests the image but never pushes it.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: janderhungrige
  IMAGE: toprun

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner's built-in BuildKit — no docker-container builder to boot.
      - name: Build image (runs tests + type-check)
        env:
          DOCKER_BUILDKIT: "1"
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMG:main" -t "$IMG:$SHA" .

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GHCR answers "unknown blob" now and then on an otherwise fine push: retry.
          push () {
            ref="$1"; n=1
            until docker push "$ref"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::docker push $ref failed after $n attempts"
                return 1
              fi
              echo "push failed (attempt $n) — retrying in $((n * 15))s"
              sleep $((n * 15))
              n=$((n + 1))
            done
          }
          push "$IMG:main"
          push "$IMG:$SHA"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed :main and :${{ github.sha }} to ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}." >> "$GITHUB_STEP_SUMMARY"
          echo "The host cron rolls it out on its next tick (~1 min): https://toprun.questenterprise.de/" >> "$GITHUB_STEP_SUMMARY"
