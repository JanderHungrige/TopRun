# Included inside the http {} block of the nginx-unprivileged image.

log_format json_log escape=json '{'
  '"time":$msec,"method":"$request_method","status":$status,'
  '"uri":"$request_uri","bytes":$body_bytes_sent,"rt":$request_time,'
  '"client":"$remote_addr","xff":"$http_x_forwarded_for","ua":"$http_user_agent"'
'}';

server_tokens off;

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# Game: static files on 8080. TLS + HSTS belong on the reverse proxy in front of this container.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log /dev/stdout json_log;
  error_log /dev/stderr warn;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "gamepad=(self), camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # Hashed build assets never change: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The entry page must always be revalidated so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "gamepad=(self), camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Health check on its own port, internal networks only, no access log.
server {
  listen 8081;
  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
  }
}
