services:
  toprun:
    build:
      context: .
    image: toprun:${BUILD_VERSION:-latest}
    init: true
    restart: unless-stopped
    ports:
      # Your reverse proxy forwards to this port. Bind to 127.0.0.1 if the proxy runs on the same host.
      - "${TOPRUN_BIND:-127.0.0.1}:${TOPRUN_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

  # Online ladder (doc 27); the game's nginx reaches it as ladder:8090. No published port.
  ladder:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: toprun-ladder:${BUILD_VERSION:-latest}
    init: true
    restart: unless-stopped
    volumes:
      - ladder-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

volumes:
  ladder-data:
